# Override to remove file mounts for Docker Desktop environments without file sharing
# All other configurations from docker-compose.yml are preserved

services:
  # Auth service - avoid host bind mount dependency
  auth-service:
    volumes:
      - auth-storage:/var/www/auth-service/storage
      - auth-cache:/var/www/auth-service/bootstrap/cache
  # MongoDB replica init - avoid host file mount dependency on Docker Desktop
  mongo-init-replica:
    entrypoint:
      - /bin/sh
      - -c
      - >
        mongosh --host mongodb:27017 --quiet --eval "try { rs.status().ok } catch (e) { rs.initiate({_id: 'emp-rs0', members: [{_id: 0, host: 'mongodb:27017'}]}) }"
    volumes: []
  # PostgreSQL services - remove config file mounts, use command-line args
  postgres-auth:
    command:
      - "postgres"
      - "-c"
      - "listen_addresses=*"
      - "-c"
      - "max_connections=200"
      - "-c"
      - "shared_buffers=256MB"
      - "-c"
      - "effective_cache_size=1GB"
      - "-c"
      - "maintenance_work_mem=64MB"
      - "-c"
      - "checkpoint_completion_target=0.9"
      - "-c"
      - "wal_buffers=16MB"
      - "-c"
      - "default_statistics_target=100"
      - "-c"
      - "random_page_cost=1.1"
      - "-c"
      - "effective_io_concurrency=200"
      - "-c"
      - "work_mem=16MB"
      - "-c"
      - "min_wal_size=1GB"
      - "-c"
      - "max_wal_size=4GB"
    volumes:
      - postgres-auth-data:/var/lib/postgresql/data

  postgres-order:
    command:
      - "postgres"
      - "-c"
      - "listen_addresses=*"
    volumes:
      - postgres-order-data:/var/lib/postgresql/data

  postgres-inventory:
    command:
      - "postgres"
      - "-c"
      - "listen_addresses=*"
    volumes:
      - postgres-inventory-data:/var/lib/postgresql/data

  postgres-payment:
    command:
      - "postgres"
      - "-c"
      - "listen_addresses=*"
    volumes:
      - postgres-payment-data:/var/lib/postgresql/data

  postgres-admin:
    command:
      - "postgres"
      - "-c"
      - "listen_addresses=*"
    volumes:
      - postgres-admin-data:/var/lib/postgresql/data

  # Redis services - remove config file mounts
  redis-master:
    command: ["redis-server", "--save", "900", "1", "--save", "300", "10", "--save", "60", "10000"]
    volumes:
      - redis-master-data:/data

  redis-replica-1:
    command: ["redis-server", "--save", "900", "1", "--save", "300", "10", "--save", "60", "10000", "--replicaof", "redis-master", "6379"]
    volumes:
      - redis-replica-1-data:/data

  redis-replica-2:
    command: ["redis-server", "--save", "900", "1", "--save", "300", "10", "--save", "60", "10000", "--replicaof", "redis-master", "6379"]
    volumes:
      - redis-replica-2-data:/data

  # Redis sentinels - remove config file mounts
  redis-sentinel-1:
    command: ["sh", "-c", "echo 'sentinel monitor mymaster redis-master 6379 2' > /tmp/sentinel.conf && echo 'sentinel down-after-milliseconds mymaster 5000' >> /tmp/sentinel.conf && echo 'sentinel failover-timeout mymaster 60000' >> /tmp/sentinel.conf && echo 'sentinel parallel-syncs mymaster 1' >> /tmp/sentinel.conf && redis-sentinel /tmp/sentinel.conf"]
    volumes: []

  redis-sentinel-2:
    command: ["sh", "-c", "echo 'sentinel monitor mymaster redis-master 6379 2' > /tmp/sentinel.conf && echo 'sentinel down-after-milliseconds mymaster 5000' >> /tmp/sentinel.conf && echo 'sentinel failover-timeout mymaster 60000' >> /tmp/sentinel.conf && echo 'sentinel parallel-syncs mymaster 1' >> /tmp/sentinel.conf && redis-sentinel /tmp/sentinel.conf"]
    volumes: []

  redis-sentinel-3:
    command: ["sh", "-c", "echo 'sentinel monitor mymaster redis-master 6379 2' > /tmp/sentinel.conf && echo 'sentinel down-after-milliseconds mymaster 5000' >> /tmp/sentinel.conf && echo 'sentinel failover-timeout mymaster 60000' >> /tmp/sentinel.conf && echo 'sentinel parallel-syncs mymaster 1' >> /tmp/sentinel.conf && redis-sentinel /tmp/sentinel.conf"]
    volumes: []